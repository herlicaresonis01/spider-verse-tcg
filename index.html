<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Spider-Verse TCG</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header id="top-bar">
        <div class="currency-badge">🕸️ <span id="web-fragments">150</span></div>
        <h1 class="app-title">SPIDER-VERSE</h1>
    </header>

    <main id="app-content">
        <!-- SECTION COLLECTION -->
        <section id="collection" class="screen active">
            <div class="screen-header">
                <h2>Collection Multivers</h2>
                <span id="collection-count" class="counter">0 / 30</span>
            </div>
            <div id="collection-grid" class="cards-grid"></div>
        </section>

        <!-- SECTION COMBAT -->
        <section id="combat" class="screen">
            <h2>Arène des Dimensions</h2>
            <div class="arena-card">
                <p>Affrontez les menaces du Multivers avec vos meilleurs tisseurs.</p>
                <button class="marvel-btn secondary" onclick="showModal('L\'Arène Multivers', 'Le système de combat est en cours de développement. Préparez votre deck !')">Lancer un Duel</button>
            </div>
        </section>

        <!-- SECTION BOUTIQUE -->
        <section id="quests" class="screen">
            <h2>Quartier Général</h2>
            <div class="booster-card-container">
                <div class="booster-banner">
                    <h3>Booster Légendaire</h3>
                    <p>3 cartes. Taux : 60% C, 30% R, 8% G, 2% M.</p>
                </div>
                <button id="open-btn" class="marvel-btn primary" onclick="openBooster()">Ouvrir (100 🕸️)</button>
            </div>
            
            <div id="booster-actions" style="display:none; text-align:center; margin-top:15px;">
                <button class="marvel-btn secondary" onclick="clearBooster()">Réinitialiser le scanner</button>
            </div>

            <div id="booster-result" class="booster-result-container"></div>
        </section>
    </main>

    <!-- NAVIGATION -->
    <nav id="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('collection', this)">
            <span class="icon">🎴</span><span>Cartes</span>
        </button>
        <button class="nav-btn" onclick="switchTab('combat', this)">
            <span class="icon">⚔️</span><span>Arène</span>
        </button>
        <button class="nav-btn" onclick="switchTab('quests', this)">
            <span class="icon">⚡</span><span>QG</span>
        </button>
    </nav>

    <!-- MODAL CUSTOM -->
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-content">
            <h3 id="modal-title">Titre</h3>
            <p id="modal-text">Texte</p>
            <button class="marvel-btn primary" onclick="closeModal()">Fermer</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
